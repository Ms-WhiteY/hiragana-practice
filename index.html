<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fff7ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ひらがなれんしゅう">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>ひらがな なぞりれんしゅう</title>
<style>
:root{
  --bg:#fff7ec;--card:#fff;--ink:#35333d;--sub:#77727b;
  --yellow:#ffd766;--blue:#4f9dff;--green:#55c98a;--orange:#ff8c68;
  --guide:#ddd8d2;--active:#ffd2c3;--done:#c9eed8;
  --shadow:0 12px 30px rgba(80,60,40,.12)
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--ink);overscroll-behavior:none}
body{padding:max(10px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));touch-action:manipulation}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.app{max-width:1050px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 2px 10px}
h1{font-size:clamp(19px,3vw,30px);margin:0}
.stars{background:#fff;border-radius:999px;padding:8px 13px;font-weight:900;box-shadow:var(--shadow);white-space:nowrap}
.rewardSummary{display:flex;align-items:stretch;justify-content:flex-end;gap:7px}
.rewardEntry{border:0;border-radius:17px;background:#fff2c8;min-width:118px;padding:5px 11px;font-weight:900;line-height:1.15;box-shadow:var(--shadow)}
.rewardEntry small{display:block;margin-top:2px;color:#7c6531;font-size:11px;white-space:nowrap}
.groupTabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 auto 8px;max-width:820px}
.groupTab{border:0;background:#fff;border-radius:17px;min-height:54px;padding:7px 10px;font-size:clamp(17px,2.7vw,23px);font-weight:900;box-shadow:var(--shadow);line-height:1.15}
.groupTab small{display:block;margin-top:3px;color:var(--sub);font-size:10px;line-height:1}
.groupTab.selected{background:#dff1ff;outline:3px solid #82c5f4}
.indexView{background:#fff;border-radius:25px;padding:clamp(10px,2vw,20px);box-shadow:var(--shadow)}
.indexPrompt{text-align:center;font-weight:900;font-size:clamp(18px,2.7vw,25px);margin:2px 0 12px}
.rewardHowItWorks{display:flex;align-items:center;justify-content:center;gap:7px;max-width:620px;margin:0 auto 12px;padding:7px 12px;border:1px solid #f1dfaa;border-radius:16px;background:#fff9e6;color:#665321;font-size:clamp(13px,2vw,17px);font-weight:900;line-height:1.35;text-align:center}
.rewardHowArrow{color:#d28a2d}
.kanaTable{display:grid;grid-template-columns:repeat(var(--table-columns),minmax(0,1fr));gap:3px;max-width:900px;margin:0 auto}
.kanaTable.voiced{max-width:600px;gap:6px}
.kanaCell,.kanaBlank{aspect-ratio:1;border:1px solid #dfd7cd;border-radius:10px;min-width:0}
.kanaCell{display:flex;align-items:center;justify-content:center;padding:0;background:#fffdfa;font-size:clamp(20px,3.6vw,35px);font-weight:900;box-shadow:0 3px 8px rgba(80,60,40,.08);cursor:pointer}
.kanaCell:active{transform:scale(.94);background:#fff1bd}
.kanaCell.recent{outline:3px solid #8dcdf6;background:#eef8ff}
.kanaGlyph{display:block;width:82%;height:82%;pointer-events:none}
.kanaGlyphStroke{fill:none;stroke:var(--ink);stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
.letter.glyphButton{display:flex;align-items:center;justify-content:center}
.letter .kanaGlyph{width:62px;height:62px;max-width:88%;max-height:88%}
.kanaBlank{background:#f6f1ea;opacity:.72}
.smallIndex{display:grid;gap:10px;max-width:850px;margin:0 auto}
.yoonIndex{grid-template-columns:repeat(2,minmax(0,1fr))}
.smallSeriesCard{background:#fffaf0;border:1px solid #eadfce;border-radius:18px;padding:8px}
.smallSeriesLabel{display:block;text-align:center;color:var(--sub);font-size:14px;font-weight:900;margin-bottom:6px}
.smallChoices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.indexChoice{border:0;border-radius:14px;min-height:52px;background:#fff;font-size:clamp(23px,4vw,34px);font-weight:900;box-shadow:0 4px 12px rgba(80,60,40,.1)}
.indexChoice.recent{outline:3px solid #8dcdf6;background:#eef8ff}
.sokuonIndex{grid-template-columns:repeat(2,minmax(0,1fr));max-width:620px}
.sokuonIndex .indexChoice{font-size:clamp(20px,3.5vw,29px);padding:12px 6px}
.practiceNav{margin-bottom:10px}
.backToIndex{border:0;border-radius:999px;background:#e8f4ff;padding:10px 16px;font-weight:900;box-shadow:var(--shadow)}
.practiceHeading{text-align:center;font-size:clamp(18px,2.8vw,25px);margin:7px 0 8px}
.rewardCardsView{background:#fff;border-radius:25px;padding:clamp(12px,2.5vw,24px);box-shadow:var(--shadow)}
.rewardCardsTitle{text-align:center;margin:5px 0 4px;font-size:clamp(24px,4vw,36px)}
.rewardCardsLead{text-align:center;color:var(--sub);font-weight:800;margin:0 0 14px}
.rewardCardsGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:900px;margin:0 auto}
.rewardCard{position:relative;min-width:0;border:2px solid #eadfce;border-radius:23px;padding:16px 13px;background:#fffaf0;text-align:center;box-shadow:0 7px 18px rgba(80,60,40,.09)}
.rewardCard.locked{background:#f4f1ed;color:#777;box-shadow:none}
.rewardCard.completed{border-color:#8bcda3;background:#f0fbf4}
.rewardCard h3{margin:0 0 7px;font-size:clamp(22px,3.4vw,31px)}
.rewardCard p{min-height:42px;margin:0 0 10px;color:var(--sub);font-weight:800;line-height:1.4;white-space:pre-line}
.rewardCard button{border:0;border-radius:15px;min-height:45px;width:100%;background:#ffe188;font-weight:900}
.rewardCard button:disabled{background:#ddd9d4;color:#888}
.rewardStamp{display:inline-block;transform:rotate(5deg);margin:-3px 0 8px;border:2px solid #45a86a;border-radius:999px;padding:3px 8px;color:#2d8751;background:#fff;font-size:12px;font-weight:900}
.rewardUnlock{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(53,51,61,.42)}
.rewardUnlockBox{width:min(92vw,420px);border-radius:28px;padding:24px 20px;background:#fffdf5;text-align:center;box-shadow:0 20px 55px rgba(40,30,20,.24)}
.rewardEnvelope{display:block;font-size:76px;line-height:1;animation:envelopeWiggle .65s ease-in-out infinite alternate}
.rewardUnlock h2{margin:9px 0 5px;font-size:clamp(24px,6vw,34px)}
.rewardUnlock p{margin:0 0 16px;color:var(--sub);font-weight:800}
.rewardUnlockActions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rewardUnlockActions button{border:0;border-radius:16px;min-height:48px;font-weight:900;background:#eee9e2}
.rewardUnlockActions .primary{background:#ffe188}
@keyframes envelopeWiggle{from{transform:rotate(-5deg) scale(.98)}to{transform:rotate(5deg) scale(1.04)}}
.rowTabs{display:grid;grid-template-columns:repeat(var(--row-count,5),minmax(0,1fr));gap:8px;margin:0 auto 8px;max-width:1050px}
.rowTabs.compact{max-width:440px}
.rowTab{border:0;background:#fff7d7;border-radius:16px;min-height:48px;font-size:clamp(15px,2.3vw,21px);font-weight:900;box-shadow:var(--shadow)}
.rowTab.selected{background:var(--yellow);outline:3px solid #efb72d}
.seriesTabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:7px;margin:0 auto 8px;max-width:820px}
.seriesTab{border:0;background:#eef7ff;border-radius:15px;min-height:47px;font-size:clamp(20px,3.5vw,30px);font-weight:900;box-shadow:var(--shadow)}
.seriesTab.selected{background:#bfe4ff;outline:3px solid #67b5ec}
.letters{display:grid;grid-template-columns:repeat(var(--letter-count,5),minmax(0,1fr));gap:8px;margin-bottom:12px}
.letters.compact{max-width:var(--letters-max-width);margin-left:auto;margin-right:auto}
.letter{border:0;background:#fff;border-radius:19px;min-height:66px;font-size:clamp(30px,6vw,48px);font-weight:800;box-shadow:var(--shadow)}
.letter.selected{outline:4px solid var(--yellow)}
.letter.wordChoice{font-size:clamp(22px,4.2vw,34px);line-height:1.05;padding:8px 5px}
.letter.wordChoice small{display:block;margin-top:6px;color:var(--sub);font-size:clamp(12px,1.9vw,16px)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px}
.card{background:#fff;border-radius:25px;box-shadow:var(--shadow)}
.boardCard{padding:10px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 6px 8px}
.prompt{font-weight:900;font-size:clamp(17px,2.3vw,24px)}
.counter{font-weight:800;font-size:14px;background:#f5f1ec;border-radius:999px;padding:7px 10px;white-space:nowrap}
.board{
  position:relative;aspect-ratio:1/1;width:100%;overflow:hidden;border-radius:21px;
  background:#fffdfa;
  touch-action:none;user-select:none;-webkit-user-select:none
}
.board.multiCell{width:min(100%,230px);margin:0 auto;border-radius:12px}
svg{display:block;width:100%;height:100%;touch-action:none}
.practiceCell{fill:#fffdfa;stroke:#d9cdbc;stroke-width:1.4;vector-effect:non-scaling-stroke}
.practiceCell.active{fill:#fffaf0;stroke:#e9a34d;stroke-width:2.2}
.practiceCell.done{fill:#f3fbf6;stroke:#9fcfb0}
.cellMidline{stroke:#e4ddd4;stroke-width:.85;stroke-dasharray:3 3;vector-effect:non-scaling-stroke;pointer-events:none}
.guideStroke{fill:none;stroke:var(--guide);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.82}
.guideStroke.active{stroke:var(--active);opacity:1}
.guideStroke.done{stroke:var(--done);opacity:1}
.trace{fill:none;stroke:var(--blue);stroke-width:5.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.demoTrace{fill:none;stroke:var(--orange);stroke-width:5.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.hanamaru{display:none;opacity:.26;pointer-events:none}
.hanamaru.show{display:block}
.hanamaruImage{width:91px;height:91px}
.startDot{fill:var(--green);stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 .8px .9px rgba(0,0,0,.17))}
.startNum{fill:#fff;font-size:7px;font-weight:900;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.endDot{fill:#fff;stroke:var(--orange);stroke-width:1.3}
.endMark{fill:var(--orange);font-size:6px;font-weight:900;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dirArrow{fill:var(--orange);stroke:#fff;stroke-width:.9;paint-order:stroke;filter:drop-shadow(0 .8px .9px rgba(0,0,0,.18));animation:arrowPulse .7s ease-in-out infinite alternate;pointer-events:none}
.pathCheckpoint{pointer-events:none;opacity:.6}
.checkpointHalo{fill:none;stroke:#f0a000;stroke-width:1.7;opacity:0}
.checkpointStar{fill:#fff3c9;stroke:#d4ab4d;stroke-width:1;filter:drop-shadow(0 .7px .7px rgba(0,0,0,.13))}
.checkpointNumber{fill:#6f5720;font-size:4.6px;font-weight:900;text-anchor:middle;dominant-baseline:central}
.pathCheckpoint.next{opacity:1}
.pathCheckpoint.next .checkpointHalo{animation:checkpointPulse 1.15s ease-in-out infinite alternate;filter:drop-shadow(0 0 1.8px rgba(240,160,0,.72))}
.pathCheckpoint.next .checkpointStar{fill:#ffd94d;stroke:#e58400;stroke-width:1.55;filter:drop-shadow(0 0 1.2px rgba(240,160,0,.5))}
.pathCheckpoint.passed{opacity:1}
.pathCheckpoint.passed .checkpointHalo{opacity:0;animation:none;filter:none}
.pathCheckpoint.passed .checkpointStar{fill:#ccebd5;stroke:#3eaa63;filter:none}
.pathCheckpoint.passed .checkpointNumber{fill:#246b3b}
@keyframes arrowPulse{to{opacity:.48}}
@keyframes checkpointPulse{from{opacity:.58;stroke-width:1.45}to{opacity:1;stroke-width:2.15}}
.side{display:flex;flex-direction:column;gap:10px}
.panel{padding:14px}
.sample{height:104px;display:flex;align-items:center;justify-content:center}
.sample svg{width:100px;height:100px}
.sample.compound{height:min(32vh,260px)}
.sample.compound svg{width:auto;height:100%}
.sampleStroke{fill:none;stroke:#35333d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.exampleWord{text-align:center;color:var(--sub);font-size:14px;font-weight:800;line-height:1.4;margin:-2px 0 9px}
.exampleWord.compound{color:var(--ink);font-size:clamp(18px,2.6vw,23px)}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mode button,.actions button{border:0;border-radius:16px;padding:11px 7px;font-weight:900;background:#f2efeb}
.mode button.active{background:#dff1ff;outline:3px solid #a6d4ff}
.actions{display:grid;gap:8px}
.actions button.primary{background:#ffe188}
.actions button.green{background:#e5f6ea}
.hint{font-size:14px;line-height:1.55;color:var(--sub);margin:10px 0 0}
.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(53,51,61,.94);color:#fff;border-radius:999px;padding:11px 17px;font-weight:900;opacity:0;transition:.18s;pointer-events:none;white-space:nowrap;z-index:5;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;bottom:25px}
.celebrate{position:absolute;inset:0;display:none;z-index:8;align-items:center;justify-content:center;background:rgba(255,253,250,.9);text-align:center}
.celebrate.show{display:flex}
.celebrate .star{display:block;font-size:clamp(70px,15vw,130px);animation:bounce .55s ease-in-out infinite alternate}
.celebrate strong{font-size:clamp(28px,6vw,55px)}
@keyframes bounce{to{transform:translateY(-12px) rotate(5deg)}}
@media(prefers-reduced-motion:reduce){.rewardEnvelope,.celebrate .star,.dirArrow,.pathCheckpoint.next .checkpointHalo{animation:none!important}}
.footer{text-align:center;color:#8b858d;font-size:11px;margin:12px 0 2px;line-height:1.5}
.footer a{color:inherit}
.appVersion{display:inline-block;margin-top:2px;font-size:10px;opacity:.8}
.install{display:none;margin:0 0 10px;border:0;border-radius:15px;background:#e8f4ff;padding:10px 14px;font-weight:800;width:100%}
@media(max-width:760px){
  .layout{grid-template-columns:1fr}
  .side{display:grid;grid-template-columns:1fr 1fr}
  .sample{height:72px}.sample svg{height:72px;width:72px}
  .exampleWord{font-size:13px;margin:-1px 0 7px}
}
@media(max-width:900px){
  .rowTabs{grid-template-columns:repeat(var(--row-count,5),minmax(0,1fr));max-width:820px}
  .rowTabs.compact{max-width:440px}
}
@media(max-width:480px){
  body{padding-left:7px;padding-right:7px}
  header{gap:5px;flex-wrap:wrap}h1{font-size:18px;white-space:nowrap}.rewardSummary{width:100%;gap:4px}.stars{padding:7px 9px}.rewardEntry{min-width:105px;padding:5px 7px;font-size:13px}.rewardEntry small{font-size:10px}
  .groupTabs{gap:5px}.groupTab{min-height:54px;padding:5px 3px;font-size:14px}
  .indexView{padding:8px 5px}.indexPrompt{margin:1px 0 9px;font-size:18px}
  .rewardHowItWorks{display:grid;grid-template-columns:1fr;gap:1px;margin-bottom:8px;padding:6px 8px}.rewardHowArrow{display:none}
  .kanaTable{gap:1px}.kanaTable.voiced{gap:4px;padding:0 12px}
  .kanaCell,.kanaBlank{border-radius:6px}.kanaCell{font-size:20px}
  .yoonIndex{grid-template-columns:1fr}.smallSeriesCard{padding:7px}.indexChoice{min-height:48px}
  .rewardCardsGrid{grid-template-columns:1fr;gap:9px}.rewardCard{padding:13px 11px}.rewardCard p{min-height:0}
  .backToIndex{padding:9px 13px}
  .rowTabs{gap:4px}.rowTab{min-height:44px;border-radius:13px;font-size:15px}
  .seriesTabs{gap:5px;grid-template-columns:repeat(auto-fit,minmax(72px,1fr))}.seriesTab{min-height:43px}
  .letters{gap:5px}.letter{min-height:55px;border-radius:15px}
  .letters.sokuon{grid-template-columns:repeat(2,minmax(0,1fr))}
  .side{grid-template-columns:1fr}
  .boardCard{padding:7px}.board{border-radius:17px}
  .board.multiCell{width:min(100%,180px);border-radius:10px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>✏️ ひらがな なぞりれんしゅう</h1>
  <div class="rewardSummary">
    <div class="stars">⭐ <span id="stars">0</span></div>
    <button class="rewardEntry" id="rewardButton">✉️ おてがみ<small id="rewardProgress"></small></button>
  </div>
</header>

<button id="installBtn" class="install">📱 この端末にアプリとして入れる</button>
<div class="groupTabs" id="groupTabs" role="group" aria-label="ひらがなのグループを選ぶ"></div>
<section class="indexView" id="indexView">
  <div class="indexPrompt">きょうは どの もじを やる？</div>
  <div class="rewardHowItWorks" aria-label="ほしを10こあつめると、おてがみカードがもらえるよ">
    <span>⭐ 10こ れんしゅうすると</span>
    <span class="rewardHowArrow" aria-hidden="true">→</span>
    <span>✉️ おてがみカードが もらえるよ！</span>
  </div>
  <div class="rowTabs compact" id="rowTabs" role="group" aria-label="ちいさい文字の種類を選ぶ" hidden></div>
  <div id="indexGrid"></div>
</section>

<section class="rewardCardsView" id="rewardCardsView" hidden>
  <button class="backToIndex" id="cardsBackToIndex">← いちらんに戻る</button>
  <h2 class="rewardCardsTitle">✉️ おてがみカード</h2>
  <p class="rewardCardsLead">ほしを あつめて、ことばを かこう！</p>
  <div class="rewardCardsGrid" id="rewardCardsGrid"></div>
</section>

<section id="practiceView" hidden>
  <div class="practiceNav">
    <button class="backToIndex" id="backToIndex">← いちらんに戻る</button>
    <h2 class="practiceHeading" id="practiceHeading"></h2>
    <div class="letters" id="letters"></div>
  </div>

  <div class="layout">
<section class="card boardCard">
  <div class="topline">
    <div class="prompt" id="prompt">🟢から 🟠▶のほうへ！</div>
    <div class="counter" id="counter"></div>
  </div>

  <div class="board" id="board">
    <svg id="svg" viewBox="0 0 109 109" aria-label="ひらがな練習">
      <g id="cellLayer" aria-hidden="true"></g>
      <g id="hanamaruLayer" class="hanamaru" aria-hidden="true">
        <image class="hanamaruImage" href="./assets/hanamaru.png" x="9" y="9" width="91" height="91" preserveAspectRatio="xMidYMid meet"/>
      </g>
      <g id="guideLayer"></g>
      <g id="traceLayer"></g>
      <g id="markerLayer"></g>
    </svg>
    <div class="toast" id="toast"></div>
    <div class="celebrate" id="celebrate">
      <div><span class="star">🌟</span><strong id="celebrateText">できた！</strong></div>
    </div>
  </div>
</section>

<aside class="side">
  <div class="card panel samplePanel">
    <div class="sample"><svg id="sampleSvg" viewBox="0 0 109 109" aria-hidden="true"></svg></div>
    <div class="exampleWord" id="exampleWord"></div>
    <div class="mode">
      <button id="traceMode" class="active">なぞる</button>
      <button id="freeMode">じぶんで</button>
    </div>
    <p class="hint">「なぞる」は書き順をチェック。<br>「じぶんで」は自由に書けます。</p>
  </div>

  <div class="card panel actions">
    <button class="primary" id="demoBtn">▶ おてほん</button>
    <button id="listenBtn">🔊 きく</button>
    <button class="green" id="resetBtn">↻ もういちど</button>
    <button id="clearBtn">🧽 けす</button>
    <p class="hint">指でもタッチペンでもOK。<br>少しくらいはみ出しても大丈夫！</p>
  </div>
</aside>
</div>
</section>

<div class="footer">
  書き順データ: <a href="https://kanjivg.tagaini.net/" target="_blank" rel="noopener">KanjiVG</a>
  （<a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>・表示調整）<br>
  個人情報の送信・広告・アクセス解析はありません。<br>
  <span class="appVersion" id="appVersion"></span>
</div>
</div>

<div class="rewardUnlock" id="rewardUnlock" role="dialog" aria-modal="true" aria-labelledby="rewardUnlockTitle" hidden>
  <div class="rewardUnlockBox">
    <span class="rewardEnvelope" aria-hidden="true">✉️✨</span>
    <h2 id="rewardUnlockTitle">おてがみカードが ひらいた！</h2>
    <p id="rewardUnlockText"></p>
    <div class="rewardUnlockActions">
      <button class="primary" id="viewUnlockedCards">みてみる</button>
      <button id="dismissUnlock">あとで</button>
    </div>
  </div>
</div>

<script src="./app-version.js"></script>
<script>

function multiplyMatrices(parent,local){
  return {
    a:parent.a*local.a+parent.c*local.b,
    b:parent.b*local.a+parent.d*local.b,
    c:parent.a*local.c+parent.c*local.d,

    e:parent.a*local.e+parent.c*local.f+parent.e,
    f:parent.b*local.e+parent.d*local.f+parent.f
  };
}

function samplesForStroke(stroke,n=180){

  const L=p.getTotalLength(),a=[];
  for(let i=0;i<=n;i++)a.push(transformPoint(p.getPointAtLength(L*i/n),stroke.transform));

function pointAtDistance(samples,length){
  let walked=0;
  for(let i=1;i<samples.length;i++){
    const segment=dist(samples[i-1],samples[i]);
    if(walked+segment>=length){
      const ratio=(length-walked)/(segment||1);
      return {x:samples[i-1].x+(samples[i].x-samples[i-1].x)*ratio,y:samples[i-1].y+(samples[i].y-samples[i-1].y)*ratio};
    }
    walked+=segment;
  }
  return samples[samples.length-1];
}
function addMarkers(i){
  markerLayer.innerHTML='';
  const stroke=currentStrokes()[i];
  const s=samplesForStroke(stroke);
  const a=s[0],z=s[s.length-1];

  // 書く向きを文字が読めなくても分かるよう、線上にオレンジ色の矢印を表示。
  const total=samplesLength(s);

  // 長い・曲がりの多い画ほど矢印を増やす。
  // だいたい24 SVG単位ごと、最大7個まで表示する。
  const arrowCount=Math.max(1,Math.min(7,Math.round(total/24)));
  for(let n=1;n<=arrowCount;n++){
    const L=total*(n/(arrowCount+1));
    const center=pointAtDistance(s,L);
    const before=pointAtDistance(s,Math.max(0,L-1.7));
    const after=pointAtDistance(s,Math.min(total,L+1.7));
    let ux=after.x-before.x, uy=after.y-before.y;
    const len=Math.hypot(ux,uy)||1;
    ux/=len; uy/=len;
    const vx=-uy, vy=ux;

    // 矢印を小さくして、曲線上に細かく置く。
    const tip={x:center.x+ux*3.7,y:center.y+uy*3.7};
    const base={x:center.x-ux*2.0,y:center.y-uy*2.0};
    const left={x:base.x+vx*2.5,y:base.y+vy*2.5};
    const right={x:base.x-vx*2.5,y:base.y-vy*2.5};
    markerLayer.appendChild(polygon([tip,left,right],'dirArrow'));
  }

  prepareCheckpointState(s,stroke);
  addVisibleCheckpointMarkers();
  markerLayer.appendChild(circle(a.x,a.y,5.3,'startDot'));
  markerLayer.appendChild(label(a.x,a.y,String(i+1),'startNum'));

  const endMarker=dist(a,z)<1.5?{x:Math.min(104,z.x+8),y:z.y+6}:z;

const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const CHECKPOINT_SPACING=24;

const SMALL_MARK_MAX_LENGTH=15;

const SMALL_MARK_PATH_TOLERANCE=7.5;
const SMALL_MARK_END_RADIUS=9;
const VISIBLE_CHECKPOINT_MIN_LENGTH=96;
const VISIBLE_CHECKPOINT_SPACING=60;
const VISIBLE_CHECKPOINT_MAX=4;

  'う:1':{type:'dot',minTravel:3.5,minProgress:.14,endRadius:19,minDirectionCos:.15}

const DEMO_SPEED=85;
const DEMO_MIN_DURATION=350;

const VISIBLE_CHECKPOINT_INDEX_OVERRIDES={
  'く:1':[0,1,2],
  'す:2':[2,3,5],
  'ち:2':[2,4,5],
  'つ:1':[2,3,4],
  'て:1':[2,4,5],
  'と:2':[1,2,3],
  'な:4':[1,2],
  'ぬ:2':[2,4,6,8],
  'ね:2':[2,5,7,8],
  'の:1':[2,3,5,7],
  'れ:2':[1,2,5,8],
  'わ:2':[1,3,6,8],
  'を:2':[1,3],
  'ん:1':[1,3,5,7],
  'ぢ:2':[0,3,5],
  'で:1':[0,4,5],
  'ば:3':[0,4],

function checkpointsFor(samples,scale=1){
  const lengths=[0];
  for(let i=1;i<samples.length;i++)lengths.push(lengths[i-1]+dist(samples[i-1],samples[i]));
  const total=lengths[lengths.length-1];
  const count=Math.max(1,Math.min(10,Math.floor(total/scale/CHECKPOINT_SPACING)));
  const result=[];
  let sampleIndex=1;
  for(let i=1;i<=count;i++){
    const target=total*i/(count+1);
    while(sampleIndex<lengths.length-1&&lengths[sampleIndex]<target)sampleIndex++;
    const before=sampleIndex-1;
    const span=lengths[sampleIndex]-lengths[before]||1;
    const ratio=(target-lengths[before])/span;
    result.push({
      x:samples[before].x+(samples[sampleIndex].x-samples[before].x)*ratio,
      y:samples[before].y+(samples[sampleIndex].y-samples[before].y)*ratio
    });
  }
  return result;
}
function samplesLength(samples){
  let total=0;
  for(let i=1;i<samples.length;i++)total+=dist(samples[i-1],samples[i]);

function strokeTolerances(samples,stroke){
  if(samplesLength(samples)<SMALL_MARK_MAX_LENGTH){

  }
  if(stroke?.role==='small')return {start:11,path:11.5,end:14};
  return {start:12,path:12.5,end:16};
}
function strokeBehavior(stroke){

}
function inputDirectionCos(inputPoints,samples){
  if(inputPoints.length<2)return -1;
  const from=inputPoints[0],to=inputPoints[inputPoints.length-1];
  const expectedFrom=samples[0],expectedTo=samples[samples.length-1];
  const ax=to.x-from.x,ay=to.y-from.y,bx=expectedTo.x-expectedFrom.x,by=expectedTo.y-expectedFrom.y;
  return (ax*bx+ay*by)/(Math.hypot(ax,ay)*Math.hypot(bx,by)||1);
}
function checkpointTurnScore(samples,index,checkpointCount){
  const center=Math.round((index+1)/(checkpointCount+1)*(samples.length-1));
  const gap=10;
  const before=samples[Math.max(0,center-gap)],point=samples[center],after=samples[Math.min(samples.length-1,center+gap)];
  const ax=point.x-before.x,ay=point.y-before.y,bx=after.x-point.x,by=after.y-point.y;
  const lengths=Math.hypot(ax,ay)*Math.hypot(bx,by)||1;

function visibleCheckpointIndexesFor(samples,checkpointCount,scale=1){
  const total=samplesLength(samples)/scale;
  if(total<VISIBLE_CHECKPOINT_MIN_LENGTH||checkpointCount<4)return[];
  const count=Math.min(checkpointCount,VISIBLE_CHECKPOINT_MAX,Math.max(2,Math.round(total/VISIBLE_CHECKPOINT_SPACING)));
  const result=[];
  const interiorCount=checkpointCount-2;
  for(let slot=0;slot<count;slot++){
    const start=1+Math.floor(slot*interiorCount/count);
    const end=1+Math.floor((slot+1)*interiorCount/count)-1;
    let best=start,bestScore=-Infinity;
    for(let index=start;index<=end;index++){
      const score=checkpointTurnScore(samples,index,checkpointCount);
      if(score>bestScore){best=index;bestScore=score}
    }
    result.push(best);
  }
  return result;
}
function starPoints(center,outer=5.1,inner=2.45){
  const result=[];

    const angle=-Math.PI/2+i*Math.PI/5;
    result.push({x:center.x+Math.cos(angle)*radius,y:center.y+Math.sin(angle)*radius});
  }

function prepareCheckpointState(samples,stroke){
  const scale=Math.hypot(stroke.transform.a,stroke.transform.b)||1;
  checkpoints=checkpointsFor(samples,scale);
  const override=VISIBLE_CHECKPOINT_INDEX_OVERRIDES[`${stroke.char}:${stroke.rawStrokeIndex+1}`];
  visibleCheckpointIndexes=override
    ? override.filter(index=>index>=0&&index<checkpoints.length)
    : visibleCheckpointIndexesFor(samples,checkpoints.length,scale);
  visibleCheckpointIndex=0;
}

}
function checkpointDistance(cp,from,to){
  const dx=to.x-from.x,dy=to.y-from.y;
  const lengthSquared=dx*dx+dy*dy;
  const t=lengthSquared?Math.max(0,Math.min(1,((cp.x-from.x)*dx+(cp.y-from.y)*dy)/lengthSquared)):0;
  return {d:Math.hypot(cp.x-(from.x+dx*t),cp.y-(from.y+dy*t)),t};
}
function advanceCheckpoints(from,to){
  // 画面に見える次の星だけを調べる。1回の速い移動で複数の星を通る場合も、
  // 移動線分上の通過順が前後しないものだけを番号順の通過扱いにする。
  const before=visibleCheckpointIndex;
  let previousT=-.02;
  while(visibleCheckpointIndex<visibleCheckpointIndexes.length){
    const required=checkpoints[visibleCheckpointIndexes[visibleCheckpointIndex]];
    const hit=checkpointDistance(required,from,to);
    if(hit.d>CHECKPOINT_RADIUS||hit.t<previousT+.01)break;
    visibleCheckpointIndex++;previousT=hit.t;
  }
  if(visibleCheckpointIndex!==before)updateCheckpointMarkers();
}
function nearestProgressAware(pt,samples,anchor){
  // 「あ」3画目や「お」2画目のように線が交差・接近する画では、
  // 全経路から最短点を探すと昔の位置へ飛び「逆向き」と誤判定しやすい。
  // 現在位置の少し後ろ〜十分先だけを探索して、進行方向を安定させる。
  const start=Math.max(0,anchor-14);
  const end=Math.min(samples.length-1,anchor+55);
  let best=anchor,bd=Infinity;
  for(let i=start;i<=end;i++){
    const d=dist(pt,samples[i]);
    if(d<bd){bd=d;best=i}
  }
  return {i:best,d:bd};
}
function pointsD(a){
  if(!a.length)return'';
  let d=`M${a[0].x.toFixed(2)} ${a[0].y.toFixed(2)}`;
  for(let i=1;i<a.length;i++)d+=` L${a[i].x.toFixed(2)} ${a[i].y.toFixed(2)}`;
  return d;
}
const SPEECH_VOLUME=.65;
const SFX_GAIN=.025;
const SPEECH_PART_PAUSE=250;
let speechSequenceToken=0;
function speak(text,force=false){
  if(!('speechSynthesis' in window))return;
  try{
    const parts=(Array.isArray(text)?text:[text]).filter(Boolean);
    if(!parts.length)return;
    const token=++speechSequenceToken;
    window.speechSynthesis.cancel();
    const voices=window.speechSynthesis.getVoices();
    const ja=voices.find(v=>(v.lang||'').toLowerCase().startsWith('ja'));
    const play=index=>{
      if(token!==speechSequenceToken||index>=parts.length)return;
      const u=new SpeechSynthesisUtterance(parts[index]);
      u.lang='ja-JP';
      u.rate=.90;
      u.pitch=1.12;
      u.volume=SPEECH_VOLUME;
      if(ja)u.voice=ja;
      u.onend=()=>{
        if(index+1<parts.length)setTimeout(()=>play(index+1),SPEECH_PART_PAUSE);
      };
      window.speechSynthesis.speak(u);
    };
    play(0);
  }catch(e){}
}
function speechCharacter(key=current){
  const item=currentPracticeItem(key);
  if(item.kind!=='single')return item.label;
  return CHAR_INFO[key].speechChar||key;
}
function displayExample(key=current){
  const item=currentPracticeItem(key);
  if(item.kind==='yoon')return `${item.word}の「${item.label}」`;
  if(item.kind==='sokuon')return `${item.word}を かいてみよう`;
  if(item.kind==='reward')return `✉️ ${item.text}を かいてみよう`;
  const info=CHAR_INFO[key];
  return info.displayExample||`${info.word}の「${key}」`;
}
function spokenIntroduction(key=current){
  const item=currentPracticeItem(key);
  if(item.kind==='yoon')return `${item.label}。${item.word}の「${item.label}」だよ。おおきい「${item.base}」と、ちいさい「${item.small}」を かくよ。`;
  if(item.kind==='sokuon')return `${item.word}。「${item.word}」を かいてみよう。ちいさい「っ」が はいっているよ。`;
  if(item.kind==='reward')return `${item.text}を かいてみよう。`;
  const info=CHAR_INFO[key],spoken=speechCharacter(key);
  if(info.speechParts)return info.speechParts.join(' ');
  if(info.speechExample)return info.speechExample;
  return info.speechChar
    ? `${spoken}。${info.word}の、${spoken}、だよ。`
    : `${spoken}。${info.word}の『${spoken}』だよ。`;
}
function speechWithSuffix(suffix,key=current){
  const item=currentPracticeItem(key);
  if(item.kind!=='single')return `${spokenIntroduction(key)}${suffix}`;
  const parts=CHAR_INFO[key].speechParts;
  if(!parts)return `${spokenIntroduction(key)}${suffix}`;
  return parts.map((part,index)=>index===parts.length-1?`${part}${suffix}`:part);
}
function currentInstruction(){
  return speechWithSuffix('');
}
function say(s,spoken=s){
  toast.textContent=s;toast.classList.add('show');
  clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),1450);
  speak(spoken);
}
function beep(ok=true){
  try{
    const A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);o.frequency.value=ok?660:220;g.gain.value=SFX_GAIN;o.start();o.stop(a.currentTime+.1);
    o.onended=()=>a.close();
  }catch(e){}
}

function start(ev){
  if(demoing)return;
  ev.preventDefault();
  const strokes=currentStrokes();
  if(mode==='trace'&&strokeIndex>=strokes.length){
    say('「もういちど」で もう1かいできるよ！','もういちど、をおしてね。');return;
  }
  const p=svgPoint(ev);
  if(mode==='trace'){
    const stroke=strokes[strokeIndex],s=samplesForStroke(stroke),a=s[0],tolerances=strokeTolerances(s,stroke);
    if(dist(p,a)>tolerances.start){
      say('🟢から はじめよう！','');beep(false);return;
    }
    prepareCheckpointState(s,stroke);updateCheckpointMarkers();
  }
  down=true;pointerId=ev.pointerId;
  try{svg.setPointerCapture(pointerId)}catch(e){}
  points=[p];maxProgress=0;offCount=0;backtrackCount=0;lastNearest=0;
  const tr=mkPath(`M${p.x} ${p.y}`,'trace');tr.id='live';traceLayer.appendChild(tr);
}

function move(ev){
  if(!down||ev.pointerId!==pointerId)return;
  ev.preventDefault();
  const p=svgPoint(ev);
  if(dist(p,points[points.length-1])<.6)return;
  points.push(p);
  const live=$('live');if(live)live.setAttribute('d',pointsD(points));

  if(mode==='trace'){
    const stroke=currentStrokes()[strokeIndex],s=samplesForStroke(stroke);
    const tolerances=strokeTolerances(s,stroke);
    const n=nearestProgressAware(p,s,lastNearest);
    const prog=n.i/(s.length-1);
    maxProgress=Math.max(maxProgress,prog);
    if(n.d>tolerances.path)offCount++;

    // 一瞬の交差・手ぶれでは「逆向き」にしない。
    // 現在までの最遠位置から大きく戻る動きが複数回続いた場合だけ加点する。
    const backward=lastNearest-n.i;
    if(backward>12 && maxProgress>.18)backtrackCount++;
    if(n.i>lastNearest)lastNearest=n.i;
    advanceCheckpoints(points[points.length-2],p);
  }
}

function completePractice(strokes=currentStrokes()){
  let newlyUnlocked=[];
  if(practiceContext==='reward'){
    completedRewardCards.add(currentRewardCard.id);
    saveStoredIds(REWARD_COMPLETED_KEY,completedRewardCards);
  }else{
    const previousStars=stars;
    stars++;
    localStorage.setItem('hiragana-stars-v3',String(stars));
    newlyUnlocked=REWARD_CARDS.filter(card=>previousStars<card.threshold&&stars>=card.threshold&&!seenRewardCards.has(card.id));
    newlyUnlocked.forEach(card=>seenRewardCards.add(card.id));
    if(newlyUnlocked.length)saveStoredIds(REWARD_SEEN_KEY,seenRewardCards);
    updateRewardSummary();
  }
  $('counter').textContent=`${strokes.length} / ${strokes.length} がめ`;
  hanamaruVisible=true;
  render(false);
  $('celebrateText').textContent=`「${currentPracticeItem().label}」できた！`;
  celebrate.classList.add('show');
  if(practiceContext!=='reward')speak(`${speechCharacter()}、できた！すごい！`);
  setTimeout(()=>{
    celebrate.classList.remove('show');
    if(newlyUnlocked.length){
      showRewardUnlock(newlyUnlocked);
      speak(['おてがみカードが とどいたよ。','おてがみを かいてみよう。']);
    }
  },1800);
}

function end(ev){
  if(!down||ev.pointerId!==pointerId)return;
  ev.preventDefault();down=false;pointerId=null;
  if(mode==='free'){
    const live=$('live');if(live)live.removeAttribute('id');
    return;
  }

  const strokes=currentStrokes(),stroke=strokes[strokeIndex],s=samplesForStroke(stroke),z=s[s.length-1],last=points[points.length-1],tolerances=strokeTolerances(s,stroke);
  const behavior=strokeBehavior(stroke),isDot=behavior?.type==='dot';
  const inputTravel=samplesLength(points);
  const dotDirectionOk=!isDot||inputDirectionCos(points,s)>=behavior.minDirectionCos;
  const offRatio=offCount/Math.max(1,points.length);
  const backRatio=backtrackCount/Math.max(1,points.length);
  const clearlyReverse=(backtrackCount>=8 && backRatio>.22)||(isDot&&inputTravel>=behavior.minTravel&&!dotDirectionOk);
  const passedAllStars=visibleCheckpointIndex===visibleCheckpointIndexes.length;
  const progressOk=maxProgress>(isDot?behavior.minProgress:.72);
  const endOk=dist(last,z)<(isDot?behavior.endRadius:tolerances.end);
  const travelOk=!isDot||inputTravel>=behavior.minTravel;

  if(progressOk && endOk && travelOk && offRatio<.52 && !clearlyReverse && passedAllStars){
    const live=$('live');if(live)live.removeAttribute('id');
    strokeIndex++;beep(true);

    if(strokeIndex>=strokes.length){
      completePractice(strokes);
    }else{
      render(false);say('じょうず！ つぎの せん ✨','じょうず！つぎのせんだよ。');
    }
  }else{
    const live=$('live');if(live)live.remove();
    if(maxProgress<.42)say('さいごまで なぞってみよう！','さいごまで、なぞってみよう。');
    else if(clearlyReverse)say('ぎゃくむきだよ！ 🟠▶の ほうへ','ぎゃくむきだよ。');
    else if(!passedAllStars&&visibleCheckpointIndexes.length)say('★を じゅんばんに とおってみよう！','ほしを、じゅんばんに、とおってみよう。');
    else say('もういっかい やってみよう！','もういっかい、やってみよう。');
    beep(false);
  }
}

async function select(ch){
  if(demoing)return;
  current=ch;
  if(practiceContext==='normal'){
    lastPracticeGroupIndex=currentGroupIndex;lastPracticeKey=ch;
  }
  strokeIndex=0;hanamaruVisible=false;render();
  if(mode==='free'&&practiceContext!=='reward')await demo(true);
}
async function selectRow(index){
  if(demoing||viewState!=='index'||index===currentRowIndex)return;
  currentRowIndex=index;currentSeriesIndex=0;strokeIndex=0;hanamaruVisible=false;
  buildIndex();
}
async function selectGroup(index){
  if(demoing||viewState!=='index'||index===currentGroupIndex)return;
  currentGroupIndex=index;currentRowIndex=0;currentSeriesIndex=0;strokeIndex=0;hanamaruVisible=false;
  buildIndex();
}
async function setMode(m){
  if(demoing)return;
  if(mode===m)return;
  mode=m;strokeIndex=0;hanamaruVisible=false;
  $('traceMode').classList.toggle('active',m==='trace');
  $('freeMode').classList.toggle('active',m==='free');
  render();
  if(m==='free'&&practiceContext!=='reward')await demo(true);
}

function demoStrokeTiming(stroke){
  const length=samplesLength(samplesForStroke(stroke));
  return {length,duration:Math.max(DEMO_MIN_DURATION,length/DEMO_SPEED*1000)};
}
function animateDemoStroke(stroke,path){
  const timing=demoStrokeTiming(stroke);
  const samples=samplesForStroke(stroke,Math.max(24,Math.ceil(timing.duration/16)));
  return new Promise(resolve=>{
    const started=performance.now();
    const draw=now=>{
      const progress=Math.min(1,(now-started)/timing.duration);
      const end=Math.max(1,Math.ceil(progress*(samples.length-1)));
      path.setAttribute('d',pointsD(samples.slice(0,end+1)));
      const before=visibleCheckpointIndex;
      while(visibleCheckpointIndex<visibleCheckpointIndexes.length&&progress>=(visibleCheckpointIndexes[visibleCheckpointIndex]+1)/(checkpoints.length+1))visibleCheckpointIndex++;
      if(visibleCheckpointIndex!==before)updateCheckpointMarkers();
      if(progress<1)requestAnimationFrame(draw);
      else resolve(timing);
    };
    requestAnimationFrame(draw);
  });
}
async function demo(silent=false){
  if(demoing)return;
  if(!silent)speak(speechWithSuffix('おてほんを、みてね。'));
  demoing=true;
  const oldMode=mode;
  const oldHanamaru=hanamaruVisible;
  const savedFreePaths=oldMode==='free'
    ? [...traceLayer.querySelectorAll('.trace')].map(path=>{
        const copy=path.cloneNode();copy.removeAttribute('id');return copy;
      })
    : [];
  hanamaruVisible=false;
  mode='trace';strokeIndex=0;render();traceLayer.innerHTML='';

  const strokes=currentStrokes();
  for(let k=0;k<strokes.length;k++){
    strokeIndex=k;render(false);
    const p=mkPath('','demoTrace');traceLayer.appendChild(p);
    await animateDemoStroke(strokes[k],p);
    const next=strokes[k+1];
    const pause=next&&next.componentIndex!==strokes[k].componentIndex?DEMO_COMPONENT_PAUSE:DEMO_STROKE_PAUSE;
    await new Promise(r=>setTimeout(r,pause));
  }

  await new Promise(r=>setTimeout(r,400));
  demoing=false;mode=oldMode;strokeIndex=0;
  hanamaruVisible=oldMode==='trace'&&oldHanamaru;
  render();
  if(oldMode==='free')savedFreePaths.forEach(path=>traceLayer.appendChild(path));
}

svg.addEventListener('pointerdown',start,{passive:false});
svg.addEventListener('pointermove',move,{passive:false});
svg.addEventListener('pointerup',end,{passive:false});
svg.addEventListener('pointercancel',end,{passive:false});
$('traceMode').onclick=()=>setMode('trace');
$('freeMode').onclick=()=>setMode('free');
$('resetBtn').onclick=()=>{if(demoing)return;strokeIndex=0;hanamaruVisible=false;render()};
$('clearBtn').onclick=()=>{if(demoing)return;traceLayer.innerHTML='';if(mode==='trace'){strokeIndex=0;hanamaruVisible=false;render()}};
$('demoBtn').onclick=()=>demo();
$('listenBtn').onclick=()=>speak(currentInstruction(),true);
$('backToIndex').onclick=backToIndex;
$('rewardButton').onclick=showRewardCards;
$('cardsBackToIndex').onclick=showIndex;
$('viewUnlockedCards').onclick=showRewardCards;
$('dismissUnlock').onclick=hideRewardUnlock;
if(!('speechSynthesis' in window)){
  $('listenBtn').textContent='🔇 こえ非対応';
  $('listenBtn').disabled=true;
}
celebrate.onclick=()=>celebrate.classList.remove('show');
if(initialUnlockedRewardCount){
  setTimeout(()=>showRewardUnlock(unlockedRewardCards().slice(0,initialUnlockedRewardCount),true),350);
}

let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;$('installBtn').style.display='block';
});
$('installBtn').onclick=async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('installBtn').style.display='none';
};

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register(`./sw.js?v=${encodeURIComponent(self.APP_VERSION)}`,{updateViaCache:'none'}).catch(()=>{});
}
